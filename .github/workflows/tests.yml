name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]" pytest ruff
      - name: Lint (errors only)
        run: ruff check --select E9,F63,F7,F82 .
      - name: Tests
        run: python -m pytest -q

  package:
    # The wheel as PyPI will get it, installed without and with the extras
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Core install (numpy and scipy only)
        run: |
          python -m venv /tmp/core
          /tmp/core/bin/pip install dist/*.whl
          cd /tmp
          /tmp/core/bin/python -c '
          from slipsurface import pile
          from slipsurface.pile import summary
          for kind in ("bored", "driven"):
              print(summary.headline(pile.analyse(pile.default_config(kind))))
          print(summary.socket_headline(pile.analyse_socket(pile.default_config("socket"))))
          try:
              from slipsurface.pile import report
          except pile.MissingDependency as exc:
              print(exc)
          else:
              raise SystemExit("the report must ask for the [report] extra")
          '
      - name: Install with all extras
        run: |
          python -m venv /tmp/all
          /tmp/all/bin/pip install "$(ls dist/*.whl)[all]"
          cd /tmp
          /tmp/all/bin/python -c '
          from slipsurface import pile
          from slipsurface.pile import report
          report.export_report("r.pdf", pile.analyse(pile.default_config()))
          '
          test "$(head -c 5 r.pdf)" = "%PDF-"
