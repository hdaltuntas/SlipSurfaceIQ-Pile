name: publish

# Publishes to PyPI when a version tag is pushed, e.g.  git tag v2026.0.0 && git push origin v2026.0.0
# PyPI side, once: add a Trusted Publisher for this repository with workflow
# "publish.yml" and environment "pypi" (no API token is stored anywhere).

on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/slipsurfaceiq-pile/
    permissions:
      id-token: write   # Trusted Publishing
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: The tag must match the package version
        run: |
          version=$(python -c "import json; print(json.load(open('slipsurface/pile/app.json'))['version'])")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match the version ${version} (pyproject.toml / app.json)"
            exit 1
          fi
      - name: Test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          python -m pytest -q
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
