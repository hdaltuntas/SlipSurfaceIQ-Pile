name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest ruff
      - name: Lint (errors only)
        run: ruff check --select E9,F63,F7,F82 .
      - name: Tests
        run: python -m pytest -q
      - name: Command line
        run: |
          python main.py --check
          python main.py analyze examples/example.pile.json

  package:
    # The wheel as PyPI will get it, installed without and with the extras
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Core install (numpy and scipy only)
        run: |
          python -m venv /tmp/core
          /tmp/core/bin/pip install dist/*.whl
          cd /tmp
          /tmp/core/bin/slipsurface-pile --check
          /tmp/core/bin/slipsurface-pile analyze "$GITHUB_WORKSPACE/examples/example.pile.json" --json
          if /tmp/core/bin/slipsurface-pile analyze "$GITHUB_WORKSPACE/examples/example.pile.json" -o r.pdf; then
            echo "the report must ask for the [report] extra"; exit 1
          fi
      - name: Install with all extras
        run: |
          python -m venv /tmp/all
          /tmp/all/bin/pip install "$(ls dist/*.whl)[all]"
          cd /tmp
          /tmp/all/bin/slipsurface-pile analyze "$GITHUB_WORKSPACE/examples/example.pile.json" -o r.pdf
          test "$(head -c 5 r.pdf)" = "%PDF-"
