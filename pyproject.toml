# Development tooling only. Run the application exclusively via python main.py.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:warnings"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E501", "E7", "E9", "F", "B", "UP"]
ignore = ["E741"]
